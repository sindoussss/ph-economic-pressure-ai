# Gate 5 of the publication remediation plan asks for pinned versions and CI.
# The pins live in requirements.txt; this is the half that proves them.
#
# What this guards: the vault recorded a fresh unpinned install producing
# "612 passed, 4 failed, 5 errors" because pip resolved Pandas 3.x. That failure
# was invisible locally, where an older environment persisted. CI installs from
# the pinned files on a clean machine every time, so environment drift shows up
# as a red build instead of as an irreproducible paper.
name: benchmark

on:
  push:
    branches: [master, pressure-monitor, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1 pytest-xdist==3.8.0

      - name: Show resolved environment
        # Stored with the run so a failing build can be compared against the
        # environment the committed artifacts were produced with.
        run: pip freeze

      - name: Run the test suite
        run: python -m pytest ph_economic_ai/tests/ -q -p no:randomly -n auto

      - name: Check the manuscripts against the committed artifacts
        # Gate 6. Fails only on UNDECLARED divergence: a draft may be ahead of or
        # behind the artifacts, but it may not claim agreement it does not have.
        run: python -m ph_economic_ai.benchmark.manuscript_check
