# Gate 5 of the publication remediation plan asks for pinned versions and CI.
# The pins live in requirements.txt / requirements-app.txt; this is the half that
# proves them.
#
# What this guards: the vault recorded a fresh unpinned install producing
# "612 passed, 4 failed, 5 errors" because pip resolved Pandas 3.x. That failure
# was invisible locally, where an older environment persisted. CI installs from
# the pinned files on a clean machine every time, so environment drift shows up
# as a red build instead of as an irreproducible paper.
#
# Two install sets, deliberately:
#   * requirements.txt      the benchmark half, which reproduces every published
#                           number with no Qt, no GPU and no API key
#   * requirements-app.txt  the app half, needed only because the TEST SUITE
#                           spans both. The first CI run failed on
#                           ModuleNotFoundError: PyQt6 for exactly this reason.
# The reproduce-the-paper claim still rests on requirements.txt alone, and the
# `benchmark-only` job below keeps that claim honest by proving it in isolation.
name: benchmark

on:
  push:
    branches: [master, pressure-monitor, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  # The claim that matters for the paper: the benchmark reproduces with the
  # benchmark pins alone. No Qt, no app dependencies.
  benchmark-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install benchmark pins only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1
      - run: pip freeze
      - name: Benchmark modules import without Qt
        run: |
          python -c "from ph_economic_ai.benchmark import run, calendar_index, provenance, selection, manuscript_check; print('benchmark imports clean')"
      - name: Check the manuscripts against the committed artifacts
        # Gate 6. Fails only on UNDECLARED divergence: a draft may be ahead of or
        # behind the artifacts, but it may not claim agreement it does not have.
        run: python -m ph_economic_ai.benchmark.manuscript_check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Qt runtime libraries
        # PyQt6 will import on a headless runner only with these present; without
        # them the failure is a bare "could not load the Qt platform plugin".
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install pinned dependencies
        # requirements-app.txt starts with `-r requirements.txt`, so this installs
        # both halves from the same pins.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install pytest==9.1.1 pytest-xdist==3.8.0

      - name: Show resolved environment
        # Stored with the run so a failing build can be compared against the
        # environment the committed artifacts were produced with.
        run: pip freeze

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest ph_economic_ai/tests/ -q -p no:randomly -n auto
